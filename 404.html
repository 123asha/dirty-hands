<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Dirty Hands</title>
<style>
  :root { --u: calc(100vw / 1400); --t18: min(18px, calc(18 * var(--u))); }
  html, body { margin: 0; height: 100%; background: #fff; color: #000; overflow: hidden; }
  body { font-family: "CoFo Sans", -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: var(--t18); -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .big { position: fixed; left: 0; right: 0; bottom: calc(22 * var(--u)); text-align: center; font-family: "CoFo Cinema", "CoFo Sans", sans-serif; font-size: calc(420 * var(--u)); line-height: .8; letter-spacing: -.01em; pointer-events: none; mix-blend-mode: difference; color: #fff; }
  .top { position: fixed; left: calc(20 * var(--u)); right: calc(20 * var(--u)); top: calc(20 * var(--u)); display: flex; justify-content: space-between; line-height: .91; letter-spacing: -.01em; }
  .top a { color: inherit; text-decoration: underline; text-underline-offset: .18em; text-decoration-thickness: 1px; }
  .note { opacity: .4; }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="top"><span class="note">This page has gone back to clay</span><a id="home" href="./">Back to Dirty Hands</a></div>
<div class="big" aria-label="404">404</div>
<script>
  // the site lives at /dirty-hands/ on GitHub Pages and at / locally: fonts and the way home follow it
  const BASE = location.pathname.startsWith('/dirty-hands') ? '/dirty-hands/' : '/';
  document.getElementById('home').href = BASE;
  [['CoFo Sans', 'CoFoSans-Regular450.woff2'], ['CoFo Cinema', 'CoFoCinema1909-Regular.otf']].forEach(([n, f]) => { const ff = new FontFace(n, `url(${BASE}${f})`); ff.load().then(x => document.fonts.add(x)).catch(() => {}); });
</script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
  // two hands of wet clay, cupped round a lump they are shaping: built from soft rounded pieces and roughened by noise, so they read as modelled by hand
  import * as THREE from 'three';
  import { mergeVertices } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js';
  import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

  const cv = document.getElementById('c');
  const R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  R.setPixelRatio(Math.min(2, devicePixelRatio)); R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
  const S = new THREE.Scene(), CAM = new THREE.PerspectiveCamera(32, 1, .1, 100); CAM.position.set(0, .4, 9.5);
  S.add(new THREE.HemisphereLight(0xfff4ea, 0x6b5143, 1.1));
  const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-3, 5, 4); S.add(key);
  const rim = new THREE.DirectionalLight(0xffe0c8, 1.2); rim.position.set(4, 1, -3); S.add(rim);

  // value noise for the clay surface
  const hash = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); };
  const smooth = t => t * t * (3 - 2 * t);
  function noise(x, y, z) { const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), xf = smooth(x - xi), yf = smooth(y - yi), zf = smooth(z - zi); let v = 0;
    for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) for (let c = 0; c < 2; c++) v += hash(xi + a, yi + b, zi + c) * (a ? xf : 1 - xf) * (b ? yf : 1 - yf) * (c ? zf : 1 - zf); return v; }
  const fbm = (x, y, z) => noise(x, y, z) * .55 + noise(x * 2.1, y * 2.1, z * 2.1) * .3 + noise(x * 4.7, y * 4.7, z * 4.7) * .15;
  function clayify(g, amp, freq, seed = 0) {               // push every vertex along its normal by a little noise: thumb marks and lumps; darker where it sinks
    g.deleteAttribute('normal'); g.deleteAttribute('uv'); g = mergeVertices(g, 1e-4); g.computeVertexNormals();   // one vertex per point, so the surface stays closed and smooth when it is pushed
    const p = g.attributes.position, n = g.attributes.normal, col = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i), z = p.getZ(i), f = fbm(x * freq + seed, y * freq, z * freq) - .5, d = f * amp;
      p.setXYZ(i, x + n.getX(i) * d, y + n.getY(i) * d, z + n.getZ(i) * d); const k = .86 + f * .55; col[i * 3] = k; col[i * 3 + 1] = k; col[i * 3 + 2] = k; }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals(); return g;
  }
    const wet = new THREE.MeshStandardMaterial({ color: 0x8f5c3f, roughness: .55, metalness: 0, vertexColors: true });

  // a clay skin for the hands: lumps and finger marks as a bump map, darker smears as colour, both drawn once on a canvas
  function clayTex(seed) {
    const n = 512, c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'), im = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const v = fbm(x / 38 + seed, y / 38, seed) * .7 + fbm(x / 9, y / 9, seed + 3) * .3, k = (y * n + x) * 4, sm = smooth(Math.max(0, Math.min(1, (fbm(x / 70 + 11, y / 70, seed + 7) - .48) * 6))), b = Math.max(0, Math.min(255, (170 + v * 90) * (1 - .45 * sm)));   /* dried clay, and darker wet smears where it was pushed */ im.data[k] = im.data[k + 1] = im.data[k + 2] = b; im.data[k + 3] = 255; }
    g.putImageData(im, 0, 0); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3); return t;
  }
  const bump = clayTex(1), skinCol = clayTex(5); skinCol.colorSpace = THREE.SRGBColorSpace;
  const handMat = new THREE.MeshStandardMaterial({ color: 0xb0704c, map: skinCol, bumpMap: bump, bumpScale: 1.8, roughness: .88, metalness: 0 });

  // the hands: an anatomical hand (the generic hand of WebXR, with all the bones of the fingers), covered in clay and posed round the lump
  const BASE = location.pathname.startsWith('/dirty-hands') ? '/dirty-hands/' : '/';
  const pair = new THREE.Group(); S.add(pair); const hands = [];
  const lumpG = clayify(new THREE.IcosahedronGeometry(1, 5), .35, 1.4, 7); const lump = new THREE.Mesh(lumpG, wet); lump.scale.set(.95, .8, .9); lump.position.y = -.25; pair.add(lump);
  const loader = new GLTFLoader();
  ['left', 'right'].forEach((side, k) => loader.load(`${BASE}models/hand-${side}.glb`, gl => {
    const root = gl.scene; root.traverse(o => { if (o.isMesh) { o.material = handMat; o.frustumCulled = false; } });
    const bones = {}; root.traverse(o => { if (o.isBone || o.type === 'Object3D') bones[o.name] = o; });
    Object.values(bones).forEach(b => { b.userData.q0 = b.quaternion.clone(); });
    root.scale.setScalar(22); pair.add(root); hands[k] = { root, bones, side: k ? 1 : -1 }; place();
  }));
  function place() {                                        // the two hands cupped round the lump, palms facing it
    hands.forEach(h => { if (!h) return; const s = h.side; h.root.position.set(s * 1.55, -1.6, 0); h.root.rotation.set(.3, s * 2.0, s * Math.PI * .8); });
  }
  const F = ['index', 'middle', 'ring', 'pinky'], Q = new THREE.Quaternion(), AX = new THREE.Vector3(1, 0, 0);
  function pose(h, t, ph) {                                 // every finger curls at its three joints, a moment after the one before: slow kneading
    F.forEach((f, k) => { const c = .55 + .2 * Math.sin(t * .9 + ph + k * .4);
      ['phalanx-proximal', 'phalanx-intermediate', 'phalanx-distal'].forEach((j, i) => { const b = h.bones[`${f}-finger-${j}`]; if (!b) return; b.quaternion.copy(b.userData.q0).multiply(Q.setFromAxisAngle(AX, -c * (.75 + i * .2))); }); });
    ['thumb-phalanx-proximal', 'thumb-phalanx-distal'].forEach((j, i) => { const b = h.bones[j]; if (!b) return; b.quaternion.copy(b.userData.q0).multiply(Q.setFromAxisAngle(AX, -(.35 + .15 * Math.sin(t * .9 + ph + 1.5)) * (1 + i * .3))); });
  }
  let mx = 0, my = 0; addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; }, { passive: true });
  function size() { const w = innerWidth, h = innerHeight; R.setSize(w, h, false); CAM.aspect = w / h; CAM.updateProjectionMatrix(); CAM.position.z = w / h < 1 ? 13 : 9.5; }
  addEventListener('resize', size); size(); pair.position.y = .7;
  const t0 = performance.now();
  (function loop(now) {
    const t = (now - t0) / 1000;
    hands.forEach((h, k) => h && pose(h, t, k * .8));
    pair.rotation.y += ((mx * .7 + Math.sin(t * .25) * .25) - pair.rotation.y) * .05; pair.rotation.x += ((my * .35 - .05) - pair.rotation.x) * .05;
    lump.rotation.y = t * .35; lump.rotation.x = Math.sin(t * .5) * .2; lump.scale.y = .8 + .04 * Math.sin(t * 1.8);
    R.render(S, CAM); requestAnimationFrame(loop);
  })(t0);
</script>
</body>
</html>
